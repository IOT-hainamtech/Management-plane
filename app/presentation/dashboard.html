<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Management Bridge · Dashboard</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#25314a;--text:#edf2ff;--muted:#93a1ba;--accent:#72a7ff;--green:#4bd39b;--yellow:#ffc76b;--red:#ff7485}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#152544,var(--bg) 55%);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1180px;margin:auto;padding:32px 22px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:28px;line-height:1.2;margin:7px 0}.sub,.muted{color:var(--muted)}
    .tools{display:flex;gap:8px;align-items:center}input,button{border:1px solid var(--line);border-radius:9px;background:#0d1527;color:var(--text);padding:10px 12px}input{width:230px}button{cursor:pointer;background:#1b3155;border-color:#31558b}button:hover{background:#244373}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card,.panel{background:linear-gradient(145deg,rgba(20,30,51,.97),rgba(14,21,37,.97));border:1px solid var(--line);border-radius:14px}.card{padding:18px}.label{color:var(--muted);font-size:13px}.value{font-size:30px;font-weight:750;margin-top:6px}.hint{color:var(--muted);font-size:12px;margin-top:4px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:18px;min-width:0}h2{font-size:16px;margin:0 0 14px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}td{overflow-wrap:anywhere}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#263550;font-size:12px}.done{color:var(--green)}.pending,.processing{color:var(--yellow)}.dead{color:var(--red)}.status{color:var(--muted);font-size:12px}.error{color:var(--red);white-space:pre-wrap;margin-top:14px}.empty{color:var(--muted);padding:20px 8px;text-align:center}.foot{margin-top:16px;color:var(--muted);font-size:12px}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.top{display:block}.tools{margin-top:15px;flex-wrap:wrap}}@media(max-width:480px){main{padding:22px 14px}.grid{gap:9px}.card{padding:13px}.value{font-size:25px}input{flex:1;min-width:170px}}
  </style>
</head>
<body>
<main>
  <header class="top">
    <div><div class="eyebrow">nextGRP · Management Bridge</div><h1>Operations dashboard</h1><div class="sub">Tình trạng đồng bộ cấu hình và tiếp nhận sự kiện</div></div>
    <div class="tools"><input id="token" type="password" autocomplete="off" placeholder="Admin token"><button id="refresh">Làm mới</button></div>
  </header>
  <div class="status" id="updated">Đang kết nối…</div>
  <section class="grid" id="cards"></section>
  <section class="columns">
    <div class="panel"><h2>Hàng đợi đồng bộ cấu hình</h2><div id="config"></div></div>
    <div class="panel"><h2>Alarm / Status gần đây</h2><div id="events"></div></div>
  </section>
  <div class="error" id="error"></div>
  <div class="foot">Dữ liệu vận hành lấy từ PostgreSQL của Bridge. Trang tự làm mới mỗi 30 giây.</div>
</main>
<script>
  const tokenInput=document.querySelector('#token'), errorBox=document.querySelector('#error');
  tokenInput.value=sessionStorage.getItem('bridgeAdminToken')||'';
  const esc=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const total=states=>Object.values(states||{}).reduce((a,b)=>a+b,0);
  function table(rows,cols){if(!rows.length)return '<div class="empty">Chưa có dữ liệu</div>';return `<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?`<span class="pill ${esc(r[c[1]])}">${esc(r[c[1]])}</span>`:esc(r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  async function refresh(){errorBox.textContent='';const token=tokenInput.value.trim();if(!token){document.querySelector('#updated').textContent='Nhập Admin token để xem dữ liệu.';return}sessionStorage.setItem('bridgeAdminToken',token);try{const response=await fetch('/admin/dashboard',{headers:{'X-Admin-Token':token}});if(!response.ok)throw new Error(response.status===401?'Admin token không hợp lệ.':`Không tải được dữ liệu (HTTP ${response.status}).`);const data=await response.json();const config=data.config_jobs||{},inbox=data.inbox_events||{};const deviceCount=total(config.device),deadCount=Object.values(config).reduce((n,s)=>n+(s.dead||0),0)+Object.values(inbox).reduce((n,s)=>n+(s.dead||0),0);document.querySelector('#cards').innerHTML=[['Thiết bị cấu hình',total(config.device),'Tổng job Device'],['Alarm đã nhận',total(inbox.alarm),'Tổng event Alarm'],['Status đã nhận',total(inbox.status),'Tổng event Status'],['Cần xử lý',deadCount,'Job/event đang dead']].map(x=>`<article class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></article>`).join('');const configRows=Object.entries(config).flatMap(([kind,states])=>Object.entries(states).map(([state,count])=>({kind,state,count})));document.querySelector('#config').innerHTML=table(configRows,[['Loại','kind'],['Trạng thái','state',true],['Số lượng','count']]);document.querySelector('#events').innerHTML=table((data.recent_events||[]).map(e=>({...e,ref:e.alarm_key||e.device_id||e.event_id,created_at:e.created_at?.replace('T',' ').slice(0,19)})),[['Loại','kind'],['Mã','ref'],['Trạng thái','state',true],['Thời điểm','created_at']]);document.querySelector('#updated').textContent=`${data.organization} · nextGRP ${data.modes.nextgrp} · Data Plane ${data.modes.data_plane} · cập nhật ${new Date().toLocaleTimeString('vi-VN')}`}catch(error){errorBox.textContent=error.message;document.querySelector('#updated').textContent='Không thể tải dữ liệu dashboard.'}}
  document.querySelector('#refresh').addEventListener('click',refresh);tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')refresh()});refresh();setInterval(refresh,30000);
</script>
</body>
</html>
