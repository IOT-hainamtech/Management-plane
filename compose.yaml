services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextwireless_bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d nextwireless_bridge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bridge_pg:/var/lib/postgresql/data

volumes:
  bridge_pg:
